[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clio-api"
version = "0.1.0"
description = "Clio's FastAPI control plane and planning-agent foundation."
requires-python = ">=3.13"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi==0.140.13",
  "httpx==0.28.1",
  "openai-agents==0.19.0",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires the local Supabase Postgres stack",
  "provider: performs an explicitly bounded real provider call",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["clio*"]
